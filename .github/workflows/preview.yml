name: Preview — Deploy, E2E & Promote

# Tier 2 — the gate. Runs when work lands on the long-lived `preview` branch.
#
#   1. build + deploy to Vercel using the Preview environment scope
#   2. alias the deployment to a STABLE hostname
#   3. shallow smoke check (is it alive?)
#   4. full Playwright E2E against that stable hostname
#   5. only if everything is green: open the PR `preview → main` for a human to merge
#
# Nothing is auto-merged. A green run produces a ready-to-review promotion PR;
# a person decides when it lands.
#
# Env vars are NOT duplicated in this file. They are pulled from Vercel's
# Preview scope, so the tests run against exactly the configuration the
# deployment itself received.

on:
  push:
    branches: [preview]
  workflow_dispatch:

# Never cancel a run in flight: the promote job merges into main, and a
# half-cancelled run could leave the promotion PR in a confusing state.
concurrency:
  group: preview-pipeline
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  PREVIEW_ORIGIN: https://preview.marketingtusk.com

jobs:
  verify:
    name: Deploy preview & run E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Vercel CLI
        run: bun install --global vercel@latest

      # Writes .vercel/project.json and .vercel/.env.preview.local
      - name: Pull Vercel Preview environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed to https://$URL"
          echo "deployment_url=https://$URL" >> "$GITHUB_OUTPUT"

      # A stable hostname means Turnstile, OAuth redirects and
      # PLAYWRIGHT_BASE_URL never have to chase an ephemeral URL.
      - name: Alias deployment to stable preview domain
        run: |
          vercel alias set "${{ steps.deploy.outputs.deployment_url }}" \
            preview.marketingtusk.com \
            --token=${{ secrets.VERCEL_TOKEN }}

      # Shallow liveness check — fail in seconds, not after a 2-minute E2E run.
      # Vercel Deployment Protection returns 401 until bypassed, which this
      # check catches immediately.
      - name: Smoke check
        run: |
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" \
              "$PREVIEW_ORIGIN/contact")
            echo "attempt $attempt → HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 6
          done
          echo "::error::Preview deployment did not become healthy."
          exit 1

      # Seed the E2E environment with ONLY the keys the suite actually reads.
      # Everything else in .vercel/.env.preview.local (Gmail refresh token,
      # admin password, Postgres URL, Sanity token) stays out of the test
      # process. Parsed with dotenv so multi-line values survive intact.
      - name: Seed test environment (allowlist)
        run: |
          bun -e '
            const fs = require("fs");
            const dotenv = require("dotenv");

            const source = dotenv.parse(fs.readFileSync(".vercel/.env.preview.local"));
            const allowed = [
              "GOOGLE_SERVICE_ACCOUNT_EMAIL",
              "GOOGLE_PRIVATE_KEY",
              "SPREADSHEET_ID",
            ];

            const missing = allowed.filter((key) => source[key] === undefined);
            if (missing.length > 0) {
              console.error(`::error::Missing from Vercel Preview scope: ${missing.join(", ")}`);
              process.exit(1);
            }

            const lines = allowed.map(
              (key) => `${key}=${JSON.stringify(source[key])}`,
            );

            fs.writeFileSync(".env.test", lines.join("\n") + "\n");
          '

          cat >> .env.test <<EOF
          PLAYWRIGHT_BASE_URL=$PREVIEW_ORIGIN
          VERCEL_AUTOMATION_BYPASS_SECRET=${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TEST_SPREADSHEET_ID=${{ secrets.TEST_SPREADSHEET_ID }}
          EOF

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Run E2E tests
        run: bunx playwright test
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-preview
          path: playwright-report/
          retention-days: 7

  promote:
    name: Open promotion PR
    needs: verify
    if: github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A PAT, not GITHUB_TOKEN: PRs opened with GITHUB_TOKEN do not trigger
          # `pull_request` workflows, so the promotion PR would never receive
          # checks and would sit blocked on required status checks.
          token: ${{ secrets.PROMOTE_TOKEN }}
          fetch-depth: 0

      - name: Open promotion PR if there is something to promote
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: |
          ahead=$(git rev-list --count origin/main..origin/preview)
          if [ "$ahead" -eq 0 ]; then
            echo "preview is in sync with main — nothing to promote."
            exit 0
          fi

          existing=$(gh pr list --base main --head preview --state open \
            --json number --jq '.[0].number')

          if [ -n "$existing" ]; then
            echo "Promotion PR #$existing is already open; new commits are picked up automatically."
            exit 0
          fi

          cat > pr-body.md <<EOF
          Automated promotion request from \`preview\`.

          - Preview deploy: $PREVIEW_ORIGIN
          - Commit: ${{ github.sha }}
          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Preview smoke check and Playwright E2E passed.
          **Review and merge manually — nothing is auto-merged.**
          EOF

          gh pr create \
            --base main \
            --head preview \
            --title "Promote preview → main" \
            --body-file pr-body.md

  withdraw-promotion:
    name: Withdraw promotion PR on failure
    needs: verify
    # Runs only when verification failed. A failed preview must never leave a
    # mergeable PR pointing at a commit that did not pass.
    if: failure() && github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PROMOTE_TOKEN }}

      - name: Close any open promotion PR
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: |
          pr=$(gh pr list --base main --head preview --state open \
            --json number --jq '.[0].number')

          if [ -z "$pr" ]; then
            echo "No open promotion PR — nothing to withdraw."
            exit 0
          fi

          cat > withdraw-comment.md <<EOF
          Preview verification failed, so this PR is no longer safe to merge.

          - Failed run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          It will be recreated automatically by the next green \`preview\` run.
          EOF

          # Close first: this is the safety-critical action. The explanatory
          # comment is best-effort so a missing `Issues` permission can never
          # prevent the PR from being withdrawn.
          gh pr close "$pr"
          gh pr comment "$pr" --body-file withdraw-comment.md || true
          echo "Closed promotion PR #$pr."
