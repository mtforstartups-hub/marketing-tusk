name: E2E Tests (Contact Form)

# Run on every PR to main AND on every push to main.
# The deploy-after-coderabbit workflow only fires on PR approval,
# so this job acts as a required status check that blocks both merging and production deploys.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Runtime ───────────────────────────────────────────────────────
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # ── 3. Dependencies ──────────────────────────────────────────────────
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── 4. Playwright browsers ───────────────────────────────────────────
      - name: Install Playwright browsers (Chromium only)
        run: bunx playwright install chromium --with-deps

      # ── 5. Build .env.test from GitHub Secrets ───────────────────────────
      # We write a .env.test file so Next.js (and our env.ts validator)
      # can pick up the secrets at runtime during `bun dev`.
      - name: Create .env.test
        run: |
          cat > .env.test << 'EOF'
          # Turnstile — always-passing test keys
          TURNSTILE_SECRET=1x0000000000000000000000000000000AA
          TURNSTILE_HOSTNAMES=localhost
          NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA

          # Google OAuth2
          CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN=${{ secrets.GOOGLE_REFRESH_TOKEN }}

          # Email
          EMAIL_USER=${{ secrets.EMAIL_USER }}
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}

          # Sheets — dedicated TEST spreadsheet (not production!)
          SPREADSHEET_ID=${{ secrets.TEST_SPREADSHEET_ID }}
          TEST_SPREADSHEET_ID=${{ secrets.TEST_SPREADSHEET_ID }}

          # Misc required by env.ts
          NEXT_PUBLIC_SITE_URL=http://localhost:3000
          PLAYWRIGHT_BASE_URL=http://localhost:3000
          CONTACT_PAGE_PATH=/
          EOF

      # ── 6. Run Playwright ────────────────────────────────────────────────
      - name: Run E2E tests
        run: bunx playwright test
        env:
          CI: "true"

      # ── 7. Upload report (always, so you can inspect failures) ───────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
