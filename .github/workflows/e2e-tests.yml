name: E2E Tests (Contact Form)

# Run on every PR to main AND on every push to main.
# The deploy-after-coderabbit workflow only fires on PR approval,
# so this job acts as a required status check that blocks both merging and production deploys.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E
    # Skip tests on 'push' if it's a merged PR (checks for standard merge or squash commit messages).
    # This prevents running tests twice (once on PR, once on merge) and duplicating emails/sheet entries.
    if: >
      github.event_name == 'pull_request' || 
      (github.event_name == 'push' && !contains(github.event.head_commit.message, 'Merge pull request') && !contains(github.event.head_commit.message, '(#'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v7

      # ── 2. Runtime ───────────────────────────────────────────────────────
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # ── 3. Dependencies ──────────────────────────────────────────────────
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── 4. Playwright browsers ───────────────────────────────────────────
      - name: Install Playwright browsers (Chromium only)
        run: bunx playwright install chromium --with-deps

      # ── 5. Build .env.test from GitHub Secrets ───────────────────────────
      # We write a .env.test file so Next.js (and our env.ts validator)
      # can pick up the secrets at runtime during `bun dev`.
      - name: Create .env.test
        run: |
          cat > .env.test << 'EOF'
          # Turnstile — always-passing test keys
          TURNSTILE_SECRET=1x0000000000000000000000000000000AA
          TURNSTILE_HOSTNAMES=localhost
          NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA

          # Google OAuth2
          CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN=${{ secrets.GOOGLE_REFRESH_TOKEN }}

          # Email
          EMAIL_USER=${{ secrets.EMAIL_USER }}
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}

          # Sheets — dedicated TEST spreadsheet (not production!)
          SPREADSHEET_ID=${{ secrets.TEST_SPREADSHEET_ID }}
          TEST_SPREADSHEET_ID=${{ secrets.TEST_SPREADSHEET_ID }}

          # Misc required by env.ts
          NEXT_PUBLIC_SITE_URL=http://localhost:3000
          PLAYWRIGHT_BASE_URL=http://localhost:3000
          CONTACT_PAGE_PATH=/contact
          
          # Sanity (dummy values to prevent compilation crash during e2e tests)
          NEXT_PUBLIC_SANITY_DATASET=production
          NEXT_PUBLIC_SANITY_PROJECT_ID=dummy-project-id
          EOF

      # ── 6. Run Playwright ────────────────────────────────────────────────
      - name: Run E2E tests
        run: bunx playwright test
        env:
          CI: "true"

      # ── 7. Upload report (always, so you can inspect failures) ───────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy-vercel:
    name: Trigger Vercel Production Deploy
    needs: e2e
    # Run only on push to main (which handles both direct pushes and merged PRs)
    # always() ensures this evaluates even if the 'e2e' job was skipped.
    if: |
      always() && 
      github.event_name == 'push' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    runs-on: ubuntu-latest
    
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Vercel CLI
        run: bun install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
