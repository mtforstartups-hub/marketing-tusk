name: PR Checks

# Tier 1 — fast, pre-merge feedback. No deployment, no side effects.
# Runs on every PR targeting `preview` (and `main`, for the promotion PR).

on:
  pull_request:
    branches: [preview, main]

concurrency:
  group: pr-checks-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # next.config.ts imports env.ts, which calls process.exit(1) when a required
    # variable is missing. These are throwaway placeholders so the build can run
    # without secrets. Never put real credentials here.
    env:
      ADMIN_EMAIL: ci@example.com
      EMAIL_USER: ci@example.com
      CLIENT_ID: ci-client-id
      CLIENT_SECRET: ci-client-secret
      REFRESH_TOKEN: ci-refresh-token
      SPREADSHEET_ID: ci-spreadsheet-id
      TURNSTILE_SECRET: 1x0000000000000000000000000000000AA
      TURNSTILE_HOSTNAMES: localhost
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_PROJECT_ID: dummy-project-id
      NEXT_PUBLIC_SITE_URL: https://www.marketingtusk.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # next.config.ts sets typescript.ignoreBuildErrors: true, so `next build`
      # will NOT fail on type errors. This step is the real type gate.
      - name: Typecheck
        run: bunx tsc --noEmit

      # `eslint` is not installed in this repo yet, so `bun run lint` is skipped.
      # Add eslint + a flat config, then enable this step.
      # - name: Lint
      #   run: bun run lint

      - name: Build
        run: bun run build
