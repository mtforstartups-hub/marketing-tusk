name: PR Checks

# Tier 1 — fast, pre-merge feedback. No deployment, no side effects.
# Runs on every PR targeting `preview` (and `main`, for the promotion PR).

on:
  pull_request:
    branches: [preview, main]

concurrency:
  group: pr-checks-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # next.config.ts imports env.ts, which calls process.exit(1) when a required
    # variable is missing. Throwaway placeholders so the build can run without
    # app secrets. Never put real credentials here.
    #
    # The two Sanity values are the exception: they are NEXT_PUBLIC_* (already
    # shipped to every browser) and the build genuinely fetches content from
    # Sanity. They come from repository variables, not secrets.
    env:
      ADMIN_EMAIL: ci@example.com
      EMAIL_USER: ci@example.com
      CLIENT_ID: ci-client-id
      CLIENT_SECRET: ci-client-secret
      REFRESH_TOKEN: ci-refresh-token
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ci@example.com
      GOOGLE_PRIVATE_KEY: ci-private-key
      SPREADSHEET_ID: ci-spreadsheet-id
      NEWSLETTER_SHEET_TAB: Newsletter
      TURNSTILE_SECRET: 1x0000000000000000000000000000000AA
      TURNSTILE_HOSTNAMES: localhost
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SITE_URL: https://www.marketingtusk.com

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Fail with an actionable message instead of a cryptic Sanity 404.
      - name: Verify Sanity build config
        env:
          PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
        run: |
          missing=()
          if [ -z "$PROJECT_ID" ]; then missing+=("NEXT_PUBLIC_SANITY_PROJECT_ID"); fi
          if [ -z "$DATASET" ]; then missing+=("NEXT_PUBLIC_SANITY_DATASET"); fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository variables: ${missing[*]}"
            echo "Add them under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # next.config.ts sets typescript.ignoreBuildErrors: true, so `next build`
      # will NOT fail on type errors. This step is the real type gate.
      - name: Typecheck
        run: bunx tsc --noEmit

      # `eslint` is not installed in this repo yet, so `bun run lint` is skipped.
      # Add eslint + a flat config, then enable this step.
      # - name: Lint
      #   run: bun run lint

      - name: Build
        run: bun run build
